<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息通知 - CloudTalk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#36CFC9',
                        dark: '#1D2129',
                        light: '#F2F3F5',
                    }
                }
            }
        }
    </script>
    <style>
        .user-menu-wrapper { position: relative; }
        .user-menu-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 0.5rem;
            width: 12rem;
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            padding: 0.5rem 0;
            z-index: 200;
        }
.user-menu-dropdown.show {
    display: block;
}
        .notification-item.unread {
            background-color: #f0f7ff;
        }
    </style>
</head>
<body class="bg-light font-inter text-dark">

<!-- 顶部导航栏（与个人中心相同） -->
<header class="sticky top-0 z-40 bg-white shadow-sm">
    <div class="container mx-auto px-4">
        <div class="flex items-center justify-between h-16">
            <a href="/" class="flex items-center space-x-2">
                <div class="w-10 h-10 rounded-lg bg-primary flex items-center justify-center text-white">
                    <i class="fa fa-comments-o text-xl"></i>
                </div>
                <span class="text-xl font-bold">CloudTalk</span>
            </a>
            
            <nav class="hidden md:flex space-x-6">
                <a href="/" class="px-1 py-2 font-medium text-gray-600 hover:text-primary">首页</a>
                <a href="#" class="px-1 py-2 font-medium text-gray-600 hover:text-primary">技术区</a>
                <a href="#" class="px-1 py-2 font-medium text-gray-600 hover:text-primary">创意区</a>
                <a href="#" class="px-1 py-2 font-medium text-gray-600 hover:text-primary">生活区</a>
            </nav>
            
            <div class="flex items-center space-x-3">
<div id="userMenu" class="relative user-menu-wrapper">
    <button onclick="toggleUserMenu(event)" class="w-10 h-10 rounded-full overflow-hidden border-2 border-white shadow-sm hover:shadow-md transition-shadow">
        <img id="topAvatar" src="/api/default-avatar?name=用户" alt="头像" class="w-full h-full object-cover">
    </button>
    <div id="userDropdown" class="user-menu-dropdown absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-2 z-50">
        <a href="javascript:void(0)" onclick="goToPage('/profile')" class="block px-4 py-2 hover:bg-light">
            <i class="fa fa-user mr-2"></i>个人中心
        </a>
        <a href="javascript:void(0)" onclick="goToPage('/notifications')" class="block px-4 py-2 hover:bg-light">
            <i class="fa fa-bell mr-2"></i>消息通知
        </a>
        <a href="javascript:void(0)" onclick="goToPage('/settings')" class="block px-4 py-2 hover:bg-light">
            <i class="fa fa-cog mr-2"></i>设置
        </a>
        <div class="border-t my-1"></div>
        <a href="javascript:void(0)" onclick="logout()" class="block px-4 py-2 text-red-500 hover:bg-light">
            <i class="fa fa-sign-out mr-2"></i>退出登录
        </a>
    </div>
</div>
            </div>
        </div>
    </div>
</header>

<!-- 主内容区 -->
<main class="container mx-auto px-4 py-6">
    <div class="max-w-3xl mx-auto">
        <div class="bg-white rounded-xl shadow-sm">
            <div class="flex items-center justify-between p-6 border-b border-gray-100">
                <h1 class="text-xl font-bold"><i class="fa fa-bell mr-2 text-primary"></i>消息通知</h1>
                <button onclick="markAllRead()" class="text-sm text-primary hover:underline">全部已读</button>
            </div>
            
            <div id="notificationsList" class="divide-y divide-gray-100">
                <!-- 动态渲染 -->
            </div>
        </div>
    </div>
</main>

<script>
let currentUser = null;

function checkAuth() {
    const savedUser = localStorage.getItem('currentUser');
    if (!savedUser) {
        window.location.href = '/';
        return false;
    }
    currentUser = JSON.parse(savedUser);
    document.getElementById('topAvatar').src = currentUser.avatar || `/api/default-avatar?name=${currentUser.username}`;
    return true;
}

async function loadNotifications() {
    if (!checkAuth()) return;
    
    const container = document.getElementById('notificationsList');
    
    // 模拟通知数据
    const notifications = [
        { id: 1, type: 'like', user: '技术先锋', content: '赞了你的帖子', post: '前端开发新趋势', time: '5分钟前', unread: true },
        { id: 2, type: 'comment', user: '创意达人', content: '评论了你的帖子', post: '新手入门PS', time: '1小时前', unread: true },
        { id: 3, type: 'follow', user: '生活美学家', content: '关注了你', time: '昨天', unread: false },
        { id: 4, type: 'reply', user: '程序员老王', content: '回复了你的评论', time: '2天前', unread: false },
    ];
    
    if (notifications.length === 0) {
        container.innerHTML = '<div class="p-12 text-center text-gray-400">暂无通知</div>';
        return;
    }
    
    container.innerHTML = notifications.map(n => `
        <div class="notification-item ${n.unread ? 'unread' : ''} p-4 hover:bg-light cursor-pointer transition-colors">
            <div class="flex items-start">
                <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary mr-3">
                    <i class="fa fa-${getIcon(n.type)}"></i>
                </div>
                <div class="flex-1">
                    <p class="text-gray-800">
                        <span class="font-medium">${n.user}</span> ${n.content}
                        ${n.post ? `<span class="text-primary">《${n.post}》</span>` : ''}
                    </p>
                    <span class="text-xs text-gray-400">${n.time}</span>
                </div>
                ${n.unread ? '<span class="w-2 h-2 bg-primary rounded-full"></span>' : ''}
            </div>
        </div>
    `).join('');
}

function getIcon(type) {
    const icons = { like: 'heart', comment: 'comment', follow: 'user-plus', reply: 'reply' };
    return icons[type] || 'bell';
}

function markAllRead() {
    alert('已标记全部已读');
}

function logout() {
    localStorage.removeItem('currentUser');
    window.location.href = '/';
}

window.onload = loadNotifications;
function toggleUserMenu(event) {
    if (event) event.stopPropagation();
    const dropdown = document.getElementById('userDropdown');
    if (dropdown) {
        dropdown.classList.toggle('show');
    }
}

function goToPage(url) {
    const dropdown = document.getElementById('userDropdown');
    if (dropdown) {
        dropdown.classList.remove('show');
    }
    window.location.href = url;
}

document.addEventListener('click', function(e) {
    const userMenu = document.getElementById('userMenu');
    const dropdown = document.getElementById('userDropdown');
    if (userMenu && dropdown && !userMenu.contains(e.target)) {
        dropdown.classList.remove('show');
    }
});
</script>
</body>
</html>
