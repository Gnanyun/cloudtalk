<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息通知 - CloudTalk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#165DFF', dark: '#1D2129', light: '#F2F3F5' } } }
        }
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }
    </script>
</head>
<body class="bg-light font-sans text-dark">

<header class="sticky top-0 z-40 bg-white shadow-sm">
    <div class="container mx-auto px-4">
        <div class="flex items-center justify-between h-16">
            <a href="/" class="flex items-center space-x-2">
                <div class="w-10 h-10 rounded-lg bg-primary flex items-center justify-center text-white">
                    <i class="fa fa-comments-o text-xl"></i>
                </div>
                <span class="text-xl font-bold">CloudTalk</span>
            </a>
            <div class="flex items-center space-x-3">
                <a href="/" class="text-gray-600 hover:text-primary text-sm">← 返回首页</a>
                <img id="topAvatar" src="/api/default-avatar?name=用户" class="w-9 h-9 rounded-full cursor-pointer" onclick="location.href='/profile'">
            </div>
        </div>
    </div>
</header>

<main class="container mx-auto px-4 py-6 max-w-3xl">
    <!-- Tab 切换 -->
    <div class="bg-white rounded-xl shadow-sm mb-4">
        <div class="flex border-b">
            <button id="tabNotif" class="tab-btn flex-1 py-4 font-medium text-primary border-b-2 border-primary" onclick="switchTab('notif')">
                <i class="fa fa-bell mr-2"></i>通知
                <span id="notifBadge" class="hidden ml-2 px-2 py-0.5 text-xs bg-red-500 text-white rounded-full"></span>
            </button>
            <button id="tabMsg" class="tab-btn flex-1 py-4 font-medium text-gray-500" onclick="switchTab('msg')">
                <i class="fa fa-envelope mr-2"></i>私信
                <span id="msgBadge" class="hidden ml-2 px-2 py-0.5 text-xs bg-red-500 text-white rounded-full"></span>
            </button>
        </div>
    </div>

    <div id="content" class="bg-white rounded-xl shadow-sm">
        <div class="text-center py-16 text-gray-400">
            <i class="fa fa-spinner fa-spin text-2xl"></i>
            <p class="mt-2 text-sm">加载中...</p>
        </div>
    </div>
</main>

<script>
let currentTab = 'notif';
let currentUser = null;

function getToken() { return ''; }  // 兼容占位，实际用 session cookie

async function loadUnreadCount() {
    try {
        const res = await fetch('/api/notifications/unread-count', { credentials: 'include' });
        if (res.status === 401) { location.href = '/'; return; }
        const data = await res.json();
        const nb = document.getElementById('notifBadge');
        const mb = document.getElementById('msgBadge');
        if (data.unread_notifications > 0) {
            nb.textContent = data.unread_notifications;
            nb.classList.remove('hidden');
        } else { nb.classList.add('hidden'); }
        if (data.unread_messages > 0) {
            mb.textContent = data.unread_messages;
            mb.classList.remove('hidden');
        } else { mb.classList.add('hidden'); }
    } catch(e) {}
}

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('text-primary', 'border-b-2', 'border-primary');
        b.classList.add('text-gray-500');
    });
    if (tab === 'notif') {
        const el = document.getElementById('tabNotif');
        el.classList.add('text-primary', 'border-b-2', 'border-primary');
        el.classList.remove('text-gray-500');
        loadNotifications();
    } else {
        const el = document.getElementById('tabMsg');
        el.classList.add('text-primary', 'border-b-2', 'border-primary');
        el.classList.remove('text-gray-500');
        loadConversations();
    }
}

async function loadNotifications() {
    const c = document.getElementById('content');
    c.innerHTML = '<div class="text-center py-16 text-gray-400"><i class="fa fa-spinner fa-spin text-2xl"></i></div>';
    try {
        const res = await fetch('/api/notifications', { credentials: 'include' });
        if (res.status === 401) { location.href = '/'; return; }
        const list = await res.json();

        // 标记已读
        fetch('/api/notifications/read', { method: 'POST', credentials: 'include' });
        setTimeout(loadUnreadCount, 500);

        if (!list.length) {
            c.innerHTML = '<div class="text-center py-16 text-gray-400"><i class="fa fa-bell-o text-4xl mb-3"></i><p>暂无通知</p></div>';
            return;
        }

        c.innerHTML = list.map(n => {
            let text = '';
            let link = '#';
            if (n.type === 'comment') {
                text = '评论了你的帖子';
                link = `/topic?id=${n.post_id}`;
            } else if (n.type === 'like') {
                text = '赞了你的帖子';
                link = `/topic?id=${n.post_id}`;
            } else if (n.type === 'follow') {
                text = '关注了你';
                link = `/profile?id=${n.sender_id || ''}`;
            } else if (n.type === 'message') {
                text = '给你发了私信';
                link = `/messages?user=${encodeURIComponent(n.sender)}`;
            }
            const timeStr = new Date(n.created_at).toLocaleString();
            const bg = n.is_read ? '' : 'bg-blue-50';

            return `
            <div class="flex items-start p-4 border-b border-gray-100 last:border-0 hover:bg-gray-50 ${bg}">
                <img src="${escapeHtml(n.sender_avatar)}" class="w-11 h-11 rounded-full cursor-pointer flex-shrink-0"
                     onclick="event.stopPropagation(); location.href='/profile?id=${n.sender_id || ''}'">
                <div class="ml-3 flex-1 cursor-pointer" onclick="location.href='${link}'">
                    <p class="text-sm">
                        <span class="font-medium">${escapeHtml(n.sender_display)}</span>
                        <span class="text-gray-600"> ${text}</span>
                    </p>
                    ${n.content ? `<p class="text-sm text-gray-500 mt-1 line-clamp-2">${escapeHtml(n.content)}</p>` : ''}
                    <p class="text-xs text-gray-400 mt-1">${timeStr}</p>
                </div>
                <button onclick="deleteNotif(${n.id}, event)" class="text-gray-300 hover:text-red-500 ml-2">
                    <i class="fa fa-times"></i>
                </button>
            </div>`;
        }).join('');
    } catch(e) {
        c.innerHTML = '<div class="text-center py-16 text-red-500">加载失败</div>';
    }
}

async function deleteNotif(id, e) {
    e.stopPropagation();
    await fetch(`/api/notifications/${id}`, { method: 'DELETE', credentials: 'include' });
    loadNotifications();
}

async function loadConversations() {
    const c = document.getElementById('content');
    c.innerHTML = '<div class="text-center py-16 text-gray-400"><i class="fa fa-spinner fa-spin text-2xl"></i></div>';
    try {
        const res = await fetch('/api/messages', { credentials: 'include' });
        if (res.status === 401) { location.href = '/'; return; }
        const list = await res.json();
        if (!list.length) {
            c.innerHTML = '<div class="text-center py-16 text-gray-400"><i class="fa fa-envelope-o text-4xl mb-3"></i><p>暂无私信</p><p class="text-xs mt-2">在用户资料页点击"发私信"开始对话</p></div>';
            return;
        }
        c.innerHTML = list.map(conv => `
            <div class="flex items-center p-4 border-b border-gray-100 last:border-0 hover:bg-gray-50 cursor-pointer"
                 onclick="location.href='/messages?user=${encodeURIComponent(conv.username)}'">
                <img src="${escapeHtml(conv.avatar)}" class="w-12 h-12 rounded-full">
                <div class="ml-3 flex-1 min-w-0">
                    <div class="flex justify-between items-center">
                        <span class="font-medium">${escapeHtml(conv.display_name)}</span>
                        <span class="text-xs text-gray-400">${new Date(conv.last_time).toLocaleDateString()}</span>
                    </div>
                    <p class="text-sm text-gray-500 truncate mt-1">${escapeHtml(conv.last_message)}</p>
                </div>
                ${conv.unread > 0 ? `<span class="ml-2 px-2 py-0.5 text-xs bg-red-500 text-white rounded-full">${conv.unread}</span>` : ''}
            </div>
        `).join('');
    } catch(e) {
        c.innerHTML = '<div class="text-center py-16 text-red-500">加载失败</div>';
    }
}

// 页面加载
(async () => {
    const saved = localStorage.getItem('currentUser');
    if (saved) {
        try { currentUser = JSON.parse(saved); } catch(e) {}
    }
    if (!currentUser) { location.href = '/'; return; }
    document.getElementById('topAvatar').src = currentUser.avatar || `/api/default-avatar?name=${encodeURIComponent(currentUser.username)}`;
    loadUnreadCount();
    switchTab('notif');
})();
</script>
</body>
</html>
