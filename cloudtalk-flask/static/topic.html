<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>话题详情 - CloudTalk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#36CFC9',
                        dark: '#1D2129',
                        light: '#F2F3F5',
                    }
                }
            }
        }
    </script>
    <style>
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal.active { display: flex; }
        .user-menu-wrapper { position: relative; }
        .user-menu-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 0.5rem;
            width: 12rem;
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            padding: 0.5rem 0;
            z-index: 200;
        }
        .user-menu-dropdown.show {
    display: block;
}
        .like-btn.active { color: #ef4444; }
        .like-btn.active i { font-weight: bold; }
    </style>
</head>
<body class="bg-light font-inter text-dark">

<!-- 登录模态框 -->
<div id="loginModal" class="modal">
    <div class="bg-white rounded-xl p-6 w-full max-w-md mx-4 relative">
        <button onclick="closeModal('login')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fa fa-times"></i></button>
        <h2 class="text-xl font-bold mb-4">登录 CloudTalk</h2>
        <div class="space-y-3">
            <input type="text" id="loginUsername" placeholder="用户名" class="w-full px-4 py-2 border rounded-lg">
            <input type="password" id="loginPassword" placeholder="密码" class="w-full px-4 py-2 border rounded-lg">
            <button id="loginBtn" class="w-full bg-primary text-white py-2 rounded-lg hover:bg-primary/90">登录</button>
            <p class="text-center text-sm text-gray-500">没有账号？ <span class="text-primary cursor-pointer" onclick="switchModal('register')">立即注册</span></p>
        </div>
    </div>
</div>

<!-- 注册模态框 -->
<div id="registerModal" class="modal">
    <div class="bg-white rounded-xl p-6 w-full max-w-md mx-4 relative">
        <button onclick="closeModal('register')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fa fa-times"></i></button>
        <h2 class="text-xl font-bold mb-4">注册账号</h2>
        <div class="space-y-3">
            <input type="text" id="regUsername" placeholder="用户名" class="w-full px-4 py-2 border rounded-lg">
            <input type="password" id="regPassword" placeholder="密码" class="w-full px-4 py-2 border rounded-lg">
            <button id="registerBtn" class="w-full bg-primary text-white py-2 rounded-lg hover:bg-primary/90">注册</button>
            <p class="text-center text-sm text-gray-500">已有账号？ <span class="text-primary cursor-pointer" onclick="switchModal('login')">去登录</span></p>
        </div>
    </div>
</div>

<!-- 顶部导航栏 -->
<header class="sticky top-0 z-40 bg-white shadow-sm">
    <div class="container mx-auto px-4">
        <div class="flex items-center justify-between h-16">
            <a href="/" class="flex items-center space-x-2">
                <div class="w-10 h-10 rounded-lg bg-primary flex items-center justify-center text-white">
                    <i class="fa fa-comments-o text-xl"></i>
                </div>
                <span class="text-xl font-bold">CloudTalk</span>
            </a>
            
            <nav class="hidden md:flex space-x-6">
                <a href="/" class="px-1 py-2 font-medium text-gray-600 hover:text-primary">首页</a>
                <a href="#" class="px-1 py-2 font-medium text-gray-600 hover:text-primary">技术区</a>
                <a href="#" class="px-1 py-2 font-medium text-gray-600 hover:text-primary">创意区</a>
                <a href="#" class="px-1 py-2 font-medium text-gray-600 hover:text-primary">生活区</a>
            </nav>
            
            <div class="flex items-center space-x-3">
                <div id="authButtons">
                    <button onclick="openModal('login')" class="text-gray-600 hover:text-primary px-3 py-2">登录</button>
                    <button onclick="openModal('register')" class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-primary/90">注册</button>
                </div>
                
                <div id="userMenu" class="hidden relative user-menu-wrapper">
    <button onclick="toggleUserMenu(event)" class="w-10 h-10 rounded-full overflow-hidden border-2 border-white shadow-sm hover:shadow-md transition-shadow">
        <img id="topAvatar" src="/api/default-avatar?name=用户" alt="头像" class="w-full h-full object-cover">
    </button>
    <div id="userDropdown" class="user-menu-dropdown absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-2 z-50">
        <a href="javascript:void(0)" onclick="goToPage('/profile')" class="block px-4 py-2 hover:bg-light">
            <i class="fa fa-user mr-2"></i>个人中心
        </a>
        <a href="javascript:void(0)" onclick="goToPage('/notifications')" class="block px-4 py-2 hover:bg-light">
            <i class="fa fa-bell mr-2"></i>消息通知
        </a>
        <a href="javascript:void(0)" onclick="goToPage('/settings')" class="block px-4 py-2 hover:bg-light">
            <i class="fa fa-cog mr-2"></i>设置
        </a>
        <div class="border-t my-1"></div>
        <a href="javascript:void(0)" onclick="logout()" class="block px-4 py-2 text-red-500 hover:bg-light">
            <i class="fa fa-sign-out mr-2"></i>退出登录
        </a>
    </div>
</div>
            </div>
        </div>
    </div>
</header>

<!-- 主内容区 -->
<main class="container mx-auto px-4 py-6">
    <div class="flex flex-col lg:flex-row gap-6">
        <!-- 左侧：话题详情 -->
        <div class="lg:w-2/3 space-y-6">
            <!-- 话题主体 -->
            <div id="topicContent" class="bg-white rounded-xl shadow-sm p-6">
                <div class="text-center py-10">
                    <i class="fa fa-spinner fa-spin text-primary text-2xl"></i>
                    <p class="text-gray-500 mt-2">加载中...</p>
                </div>
            </div>
            
            <!-- 评论区 -->
            <div class="bg-white rounded-xl shadow-sm p-6">
                <h3 class="font-bold text-lg mb-4">
                    <i class="fa fa-comments-o mr-2 text-primary"></i>
                    评论 <span id="commentCount" class="text-gray-500 text-base font-normal ml-2">0</span>
                </h3>
                
                <!-- 发表评论 -->
                <div class="flex space-x-3 mb-6">
                    <img id="commentAvatar" src="/api/default-avatar?name=用户" alt="头像" class="w-10 h-10 rounded-full object-cover">
                    <div class="flex-1">
                        <textarea id="commentInput" placeholder="写下你的评论..." rows="3" 
                                  class="w-full px-4 py-2 border rounded-lg resize-none focus:outline-none focus:ring-2 focus:ring-primary/20"></textarea>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-xs text-gray-400">文明发言，友善交流</span>
                            <button id="submitCommentBtn" class="bg-primary text-white px-6 py-2 rounded-lg hover:bg-primary/90">
                                发表评论
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- 评论列表 -->
                <div id="commentsList" class="space-y-4">
                    <!-- 动态渲染 -->
                </div>
            </div>
        </div>
        
        <!-- 右侧：发布者信息 -->
        <div class="lg:w-1/3 space-y-6">
            <!-- 发布者卡片 -->
            <div id="authorCard" class="bg-white rounded-xl shadow-sm p-6">
                <h3 class="font-bold mb-4"><i class="fa fa-user-circle-o mr-2 text-primary"></i>发布者</h3>
                <div class="flex flex-col items-center">
                    <img id="authorAvatar" src="/api/default-avatar?name=作者" alt="头像" 
                         class="w-20 h-20 rounded-full object-cover border-4 border-white shadow">
                    <h4 id="authorName" class="font-bold text-lg mt-3">加载中...</h4>
                    <p id="authorBio" class="text-gray-500 text-sm mt-1">分享知识，传递价值</p>
                    <div class="flex justify-around w-full mt-4 pt-4 border-t border-gray-100">
                        <div class="text-center">
                            <p id="authorPosts" class="font-bold text-xl">0</p>
                            <p class="text-xs text-gray-500">发帖</p>
                        </div>
                        <div class="text-center">
                            <p id="authorFollowers" class="font-bold text-xl">0</p>
                            <p class="text-xs text-gray-500">粉丝</p>
                        </div>
                        <div class="text-center">
                            <p id="authorLikes" class="font-bold text-xl">0</p>
                            <p class="text-xs text-gray-500">获赞</p>
                        </div>
                    </div>
                    <button id="followAuthorBtn" class="w-full mt-4 bg-primary text-white py-2 rounded-lg hover:bg-primary/90">
                        <i class="fa fa-plus mr-1"></i>关注
                    </button>
                </div>
            </div>
            
            <!-- 相关推荐 -->
            <div class="bg-white rounded-xl shadow-sm p-6">
                <h3 class="font-bold mb-4"><i class="fa fa-link mr-2 text-primary"></i>相关推荐</h3>
                <div id="relatedPosts" class="space-y-3">
                    <!-- 动态渲染 -->
                </div>
            </div>
        </div>
    </div>
</main>

<script>
// ---------- XSS 防御：HTML 转义 ----------
function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

// ---------- 全局状态 ----------
let currentUser = null;
let currentTopic = null;
let topicId = null;

// 从URL获取话题ID
function getTopicIdFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get('id');
}

// 模态框操作
function openModal(type) {
    document.getElementById(type + 'Modal').classList.add('active');
}
function closeModal(type) {
    document.getElementById(type + 'Modal').classList.remove('active');
}
function switchModal(to) {
    closeModal('login');
    closeModal('register');
    openModal(to);
}

// 更新认证UI
function updateAuthUI() {
    const authButtons = document.getElementById('authButtons');
    const userMenu = document.getElementById('userMenu');
    
    if (currentUser) {
        authButtons.classList.add('hidden');
        userMenu.classList.remove('hidden');
        
        const avatarUrl = currentUser.avatar || `/api/default-avatar?name=${encodeURIComponent(currentUser.username)}`;
        const topAvatar = document.getElementById('topAvatar');
        if (topAvatar) {
            topAvatar.src = avatarUrl;
            topAvatar.onerror = function() {
                this.src = `/api/default-avatar?name=${encodeURIComponent(currentUser.username)}`;
            };
        }
        
        const commentAvatar = document.getElementById('commentAvatar');
        if (commentAvatar) {
            commentAvatar.src = avatarUrl;
            commentAvatar.onerror = function() {
                this.src = `/api/default-avatar?name=${encodeURIComponent(currentUser.username)}`;
            };
        }
    } else {
        authButtons.classList.remove('hidden');
        userMenu.classList.add('hidden');
        
        const commentAvatar = document.getElementById('commentAvatar');
        if (commentAvatar) {
            commentAvatar.src = '/api/default-avatar?name=用户';
        }
    }
}

function logout() {
    currentUser = null;
    localStorage.removeItem('currentUser');
    updateAuthUI();
    window.location.href = '/';
}

// 加载话题详情
async function loadTopic() {
    topicId = getTopicIdFromUrl();
    if (!topicId) {
        window.location.href = '/';
        return;
    }
    
    const container = document.getElementById('topicContent');
    container.innerHTML = `
        <div class="text-center py-10">
            <i class="fa fa-spinner fa-spin text-primary text-2xl"></i>
            <p class="text-gray-500 mt-2">加载中...</p>
        </div>
    `;
    
    try {
        const res = await fetch(`/api/topic/${topicId}`);
        const data = await res.json();
        
        if (data.status === 'error') {
            alert(data.msg);
            window.location.href = '/';
            return;
        }
        
        currentTopic = data.topic;
        
        renderTopicContent();
        renderAuthorCard();
        renderRelatedPosts();
        loadComments();
        
        // 增加浏览量
        fetch(`/api/topic/${topicId}/view`, { method: 'POST' });
    } catch (e) {
        console.error('加载失败:', e);
        container.innerHTML = `
            <div class="text-center py-10">
                <i class="fa fa-exclamation-circle text-red-500 text-2xl"></i>
                <p class="text-gray-500 mt-2">加载失败，请刷新重试</p>
            </div>
        `;
    }
}

// 渲染话题内容
function renderTopicContent() {
    const container = document.getElementById('topicContent');
    const topic = currentTopic;
    
    const isLiked = currentUser && topic.likedBy ? topic.likedBy.includes(currentUser.id) : false;
    
    container.innerHTML = `
        <div class="mb-4">
            <a href="/" class="text-primary hover:underline text-sm">
                <i class="fa fa-arrow-left mr-1"></i>返回首页
            </a>
        </div>
        <h1 class="text-2xl font-bold mb-4">${escapeHtml(topic.title)}</h1>
        <div class="flex items-center justify-between mb-4 pb-4 border-b border-gray-100">
            <div class="flex items-center space-x-3">
                <img src="${escapeHtml(topic.author_avatar || '/api/default-avatar?name=' + encodeURIComponent(topic.author))}" 
                     alt="头像" class="w-10 h-10 rounded-full object-cover"
                     onerror="this.src='/api/default-avatar?name=${encodeURIComponent(topic.author)}'">
                <div>
                    <p class="font-medium">${escapeHtml(topic.author)}</p>
                    <p class="text-xs text-gray-400">${new Date(topic.created_at).toLocaleString()} · 阅读 ${topic.views || 0}</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <button class="like-btn flex items-center space-x-1 ${isLiked ? 'active text-red-500' : 'text-gray-500'} hover:text-red-500 transition-colors" 
                        onclick="handleLike(${topic.id})">
                    <i class="fa ${isLiked ? 'fa-heart' : 'fa-heart-o'} text-xl"></i>
                    <span id="likeCount" class="font-medium">${topic.likes || 0}</span>
                </button>
                <button class="flex items-center space-x-1 text-gray-500">
                    <i class="fa fa-bookmark-o text-xl"></i>
                    <span class="hidden sm:inline">收藏</span>
                </button>
                <button class="flex items-center space-x-1 text-gray-500">
                    <i class="fa fa-share-square-o text-xl"></i>
                    <span class="hidden sm:inline">分享</span>
                </button>
            </div>
        </div>
        <div class="prose max-w-none">
            <p class="text-gray-700 leading-relaxed whitespace-pre-wrap">${escapeHtml(topic.content)}</p>
        </div>
        <div class="mt-6 pt-4 border-t border-gray-100 flex flex-wrap gap-2">
            ${topic.tags ? topic.tags.map(tag => `
                <span class="px-3 py-1 bg-light text-gray-600 text-sm rounded-full">#${escapeHtml(tag)}</span>
            `).join('') : ''}
        </div>
    `;
}

// 渲染发布者卡片
function renderAuthorCard() {
    const topic = currentTopic;
    
    if (!topic) return;
    
    const authorAvatar = document.getElementById('authorAvatar');
    const avatarUrl = topic.author_avatar || `/api/default-avatar?name=${encodeURIComponent(topic.author || '用户')}`;
    authorAvatar.src = avatarUrl;
    authorAvatar.onerror = function() {
        this.src = `/api/default-avatar?name=${encodeURIComponent(topic.author || '用户')}`;
    };
    
    document.getElementById('authorName').textContent = topic.author || '匿名用户';
    document.getElementById('authorPosts').textContent = topic.author_posts || 0;
    document.getElementById('authorFollowers').textContent = topic.author_followers || 0;
    document.getElementById('authorLikes').textContent = topic.author_likes || 0;
    
    const followBtn = document.getElementById('followAuthorBtn');
    const isFollowing = currentUser && topic.is_following;
    
    // 如果是作者本人，隐藏关注按钮
    if (currentUser && currentUser.username === topic.author) {
        followBtn.style.display = 'none';
    } else {
        followBtn.style.display = 'block';
        if (isFollowing) {
            followBtn.innerHTML = '<i class="fa fa-check mr-1"></i>已关注';
            followBtn.classList.remove('bg-primary', 'hover:bg-primary/90');
            followBtn.classList.add('bg-gray-200', 'text-gray-600');
        } else {
            followBtn.innerHTML = '<i class="fa fa-plus mr-1"></i>关注';
            followBtn.classList.remove('bg-gray-200', 'text-gray-600');
            followBtn.classList.add('bg-primary', 'hover:bg-primary/90');
        }
    }
}

// 渲染相关推荐
function renderRelatedPosts() {
    const container = document.getElementById('relatedPosts');
    const related = currentTopic.related || [];
    
    if (related.length === 0) {
        container.innerHTML = '<p class="text-gray-400 text-sm text-center py-4">暂无相关推荐</p>';
        return;
    }
    
    container.innerHTML = related.slice(0, 5).map(post => `
        <a href="/topic?id=${post.id}" class="block p-3 rounded-lg hover:bg-light transition-colors">
            <h4 class="font-medium text-sm line-clamp-2">${escapeHtml(post.title)}</h4>
            <div class="flex items-center justify-between mt-2">
                <span class="text-xs text-gray-500">${escapeHtml(post.author)}</span>
                <span class="text-xs text-gray-400"><i class="fa fa-eye mr-1"></i>${post.views || 0}</span>
            </div>
        </a>
    `).join('');
}

// 加载评论
async function loadComments() {
    const container = document.getElementById('commentsList');
    
    try {
        const res = await fetch(`/api/topic/${topicId}/comments`);
        
        if (!res.ok) {
            throw new Error(`HTTP error! status: ${res.status}`);
        }
        
        const comments = await res.json();
        
        document.getElementById('commentCount').textContent = comments.length;
        
        if (comments.length === 0) {
            container.innerHTML = '<p class="text-gray-400 text-center py-8">暂无评论，快来抢沙发吧~</p>';
            return;
        }
        
        container.innerHTML = comments.map(comment => `
            <div class="flex space-x-3 py-3 border-b border-gray-100 last:border-0">
                <img src="${escapeHtml(comment.avatar || '/api/default-avatar?name=' + encodeURIComponent(comment.author || '用户'))}" 
                     alt="头像" class="w-10 h-10 rounded-full object-cover"
                     onerror="this.src='/api/default-avatar?name=${encodeURIComponent(comment.author || '用户')}'">
                <div class="flex-1">
                    <div class="flex items-center justify-between">
                        <div>
                            <span class="font-medium text-sm">${escapeHtml(comment.author || '匿名')}</span>
                            ${comment.is_author ? '<span class="ml-2 px-1.5 py-0.5 bg-primary/10 text-primary text-xs rounded">作者</span>' : ''}
                        </div>
                        <span class="text-xs text-gray-400">${new Date(comment.created_at).toLocaleString()}</span>
                    </div>
                    <p class="text-sm text-gray-700 mt-1">${escapeHtml(comment.content)}</p>
                    <div class="flex items-center space-x-4 mt-2">
                        <button class="text-xs text-gray-400 hover:text-primary" onclick="handleCommentLike(${comment.id})">
                            <i class="fa fa-heart-o mr-1"></i>${comment.likes || 0}
                        </button>
                        <button class="text-xs text-gray-400 hover:text-primary" data-reply-author="${escapeHtml(comment.author || '')}" onclick="handleReply(${comment.id}, this.getAttribute('data-reply-author'))">
                            <i class="fa fa-reply mr-1"></i>回复
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    } catch (e) {
        console.error('加载评论失败:', e);
        container.innerHTML = '<p class="text-red-500 text-center py-8">加载评论失败，请刷新重试</p>';
    }
}

// 处理点赞
async function handleLike(topicId) {
    if (!currentUser) {
        alert('请先登录');
        openModal('login');
        return;
    }
    
    try {
        const res = await fetch(`/api/topic/${topicId}/like`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: currentUser.username })
        });
        const data = await res.json();
        
        if (data.status === 'success') {
            const likeBtn = document.querySelector('.like-btn');
            const likeCount = document.getElementById('likeCount');
            const icon = likeBtn.querySelector('i');
            
            if (data.action === 'liked') {
                likeBtn.classList.add('active', 'text-red-500');
                icon.className = 'fa fa-heart text-xl';
                likeCount.textContent = parseInt(likeCount.textContent) + 1;
            } else {
                likeBtn.classList.remove('active', 'text-red-500');
                icon.className = 'fa fa-heart-o text-xl';
                likeCount.textContent = parseInt(likeCount.textContent) - 1;
            }
        }
    } catch (e) {
        console.error('点赞失败:', e);
    }
}

// 处理评论
async function handleComment() {
    if (!currentUser) {
        alert('请先登录后再评论');
        openModal('login');
        return;
    }
    
    const input = document.getElementById('commentInput');
    const content = input.value.trim();
    
    if (!content) {
        alert('请输入评论内容');
        return;
    }
    
    const submitBtn = document.getElementById('submitCommentBtn');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-1"></i>发表中...';
    
    try {
        const res = await fetch(`/api/topic/${topicId}/comments`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                content: content
            })
        });
        
        const data = await res.json();
        
        if (data.status === 'success') {
            input.value = '';
            await loadComments(); // 重新加载评论
            alert('评论成功');
        } else {
            alert(data.msg || '评论失败');
        }
    } catch (e) {
        console.error('评论失败:', e);
        alert('评论失败，请重试');
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '发表评论';
    }
}

// 处理关注作者
async function handleFollowAuthor() {
    if (!currentUser) {
        alert('请先登录');
        openModal('login');
        return;
    }
    
    const btn = document.getElementById('followAuthorBtn');
    const isFollowing = btn.innerHTML.includes('已关注');
    
    try {
        const res = await fetch(`/api/user/follow`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                follower: currentUser.username,
                following: currentTopic.author
            })
        });
        const data = await res.json();
        
        if (data.status === 'success') {
            if (isFollowing) {
                btn.innerHTML = '<i class="fa fa-plus mr-1"></i>关注';
                btn.classList.remove('bg-gray-200', 'text-gray-600');
                btn.classList.add('bg-primary', 'hover:bg-primary/90');
            } else {
                btn.innerHTML = '<i class="fa fa-check mr-1"></i>已关注';
                btn.classList.remove('bg-primary', 'hover:bg-primary/90');
                btn.classList.add('bg-gray-200', 'text-gray-600');
            }
            
            // 更新粉丝数
            const followersEl = document.getElementById('authorFollowers');
            const currentFollowers = parseInt(followersEl.textContent);
            followersEl.textContent = isFollowing ? currentFollowers - 1 : currentFollowers + 1;
        }
    } catch (e) {
        console.error('关注失败:', e);
    }
}

// 页面加载
window.onload = () => {
    // 只从 URL 参数获取登录状态（从首页登录后跳转时传递）
    const urlParams = new URLSearchParams(window.location.search);
    const userFromUrl = urlParams.get('user');
    
    if (userFromUrl) {
        try {
            currentUser = JSON.parse(decodeURIComponent(userFromUrl));
            // 可以选择是否保存到 localStorage
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
        } catch (e) {
        }
    }
    // 如果 URL 没有用户信息，从 localStorage 恢复
    if (!currentUser) {
        const savedUser = localStorage.getItem('currentUser');
        if (savedUser) {
            try {
                currentUser = JSON.parse(savedUser);
            } catch (e) {}
        }
    }
    // 不从 localStorage 自动恢复，确保每次直接访问话题页也是未登录状态
    
    // 更新 UI
    updateAuthUI();
    
    // 加载话题内容
    loadTopic();
};
function toggleUserMenu(event) {
    if (event) event.stopPropagation();
    const dropdown = document.getElementById('userDropdown');
    if (dropdown) {
        dropdown.classList.toggle('show');
    }
}

function goToPage(url) {
    const dropdown = document.getElementById('userDropdown');
    if (dropdown) {
        dropdown.classList.remove('show');
    }
    window.location.href = url;
}

document.addEventListener('click', function(e) {
    const userMenu = document.getElementById('userMenu');
    const dropdown = document.getElementById('userDropdown');
    if (userMenu && dropdown && !userMenu.contains(e.target)) {
        dropdown.classList.remove('show');
    }
});
